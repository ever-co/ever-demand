packages:
  - packages/common
  - packages/common-angular
  - packages/core
  - e2e
  - packages/admin-web-angular
  - packages/carrier-mobile-ionic
  - packages/merchant-tablet-ionic
  - packages/shop-mobile-expo
  - packages/shop-web-angular
  - packages/shop-web-gatsby
  - packages/shop-mobile-ionic

# Packages whose install (build) scripts may run: native addons and downloaded binaries.
allowBuilds:
  '@apollo/protobufjs': false
  '@apollo/client': false
  '@nestjs/core': true
  '@scarf/scarf': false
  '@parcel/watcher': true
  '@swc/core': true
  bcrypt: true
  core-js: false
  dtrace-provider: false
  core-js-pure: false
  es5-ext: false
  esbuild: true
  gatsby: false
  gatsby-cli: false
  lmdb: true
  mongodb-memory-server: true
  msgpackr-extract: true
  nx: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

# Peer ranges that lag the Angular release train. Each entry is a library whose build links
# fine on the newer Angular (Ivy partial compilation); see docs/latest-stack/<lane>.md.
peerDependencyRules:
  allowedVersions:
    # admin-web-angular: Nebular 17 declares Angular ^21 (there is no Angular 22 release yet).
    '@nebular/theme>@angular/animations': '22'
    '@nebular/theme>@angular/cdk': '22'
    '@nebular/theme>@angular/common': '22'
    '@nebular/theme>@angular/core': '22'
    '@nebular/theme>@angular/router': '22'
    '@nebular/auth>@angular/common': '22'
    '@nebular/auth>@angular/core': '22'
    '@nebular/auth>@angular/forms': '22'
    '@nebular/auth>@angular/router': '22'
    '@nebular/security>@angular/common': '22'
    '@nebular/security>@angular/core': '22'
    '@nebular/security>@angular/router': '22'

minimumReleaseAgeExclude:
  - '@types/node@26.6.10'
  - mongoose@9.13.1
  - '@capacitor/android@8.6.3'
  - '@capacitor/cli@8.6.3'
  - '@capacitor/core@8.6.3'
  - '@capacitor/ios@8.6.3'
  - '@ionic/angular@9.0.14'
  - '@ionic/core@9.0.14'
  - '@vitest/mocker@5.1.2'
  - '@vitest/spy@5.1.2'
  - vitest@5.1.2
  - '@types/react@19.3.3'
  - i18next@27.2.9
  - react-native-qrcode-svg@6.3.55
  - '@aws-sdk/client-cloudwatch-logs@3.1178.0'
  - '@nestjs/common@12.6.2'
  - '@nestjs/core@12.6.2'
  - '@nestjs/platform-express@12.6.2'
  - '@nestjs/testing@12.6.2'
  - '@graphql-tools/load-files@8.0.10'
  - '@graphql-tools/merge@10.0.10'
  - '@graphql-tools/utils@13.2.3'
  - '@graphql-tools/schema@11.0.10'
  - '@vitest/mocker@5.1.2'
  - '@vitest/spy@5.1.2'
  - vitest@5.1.2
patchedDependencies:
  '@nebular/theme@17.0.0': patches/@nebular__theme@17.0.0.patch

# Undeclared imports in third-party packages. Without these they resolve whatever version pnpm hoisted
# (e.g. admin's ionicons 4) instead of the consuming app's own one.
packageExtensions:
  ionic-selectable@8:
    peerDependencies:
      ionicons: '>=7'
