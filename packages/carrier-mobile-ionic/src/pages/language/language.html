<ion-header class="bar-brand bar bar-header disable-user-behavior">
	<div class="buttons buttons-left header-item">
		<span class="left-buttons">
			<div class="waves-effect waves-classic">
				<ion-menu-toggle class="button-icon">
					<ion-icon name="menu"></ion-icon>
				</ion-menu-toggle>
			</div>
		</span>
	</div>
	<ion-title id="languageTitle">
		{{ 'LANGUAGE_VIEW.TITLE' | translate }}
	</ion-title>
</ion-header>

<ion-content class="language-content ion-padding">
	<div class="content">
		<ion-radio-group [(ngModel)]="language" (ionChange)="languageChange()">
			<ion-item>
				<ion-radio value="en-US" justify="space-between">{{ 'LANGUAGE_VIEW.ENGLISH' | translate }}</ion-radio>
			</ion-item>

			<ion-item>
				<ion-radio value="bg-BG" justify="space-between">{{ 'LANGUAGE_VIEW.BULGARIAN' | translate }}</ion-radio>
			</ion-item>

			<ion-item>
				<ion-radio value="he-IL" justify="space-between">{{ 'LANGUAGE_VIEW.HEBREW' | translate }}</ion-radio>
			</ion-item>

			<ion-item>
				<ion-radio value="ru-RU" justify="space-between">{{ 'LANGUAGE_VIEW.RUSSIAN' | translate }}</ion-radio>
			</ion-item>
			<ion-item>
				<ion-radio value="es-ES" justify="space-between">{{ 'LANGUAGE_VIEW.SPANISH' | translate }}</ion-radio>
			</ion-item>
			<ion-item>
				<ion-radio value="fr-FR" justify="space-between">{{ 'LANGUAGE_VIEW.FRENCH' | translate }}</ion-radio>
			</ion-item>
		</ion-radio-group>
	</div>
</ion-content>
