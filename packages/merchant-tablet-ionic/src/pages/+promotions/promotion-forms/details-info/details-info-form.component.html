<form class="carrier-basic-info" [formGroup]="form">
	<ion-row>
		<ion-col>
			<ion-item>
				<ion-input labelPlacement="floating"
					type="number"
					formControlName="purchasesCount"
					[placeholder]="
						'CARRIERS_VIEW.PROMOTIONS.PURCHASES_COUNT' | translate
					"><div slot="label" class="labels">{{
					'CARRIERS_VIEW.PROMOTIONS.PURCHASES_COUNT' | translate
				}}</div></ion-input>
			</ion-item>
		</ion-col>
		<ion-col>
			<ion-item>
				<ion-input labelPlacement="floating"
					type="number"
					formControlName="promoPrice"
					[placeholder]="'PROMOTIONS.PROMO_PRICE' | translate"><div slot="label" class="labels">{{
					'PROMOTIONS.PROMO_PRICE' | translate
				}}</div></ion-input>
			</ion-item>
		</ion-col>
	</ion-row>
	<ion-row>
		<ion-col text-center>
			<ion-item class="">
				<ion-checkbox labelPlacement="start" justify="space-between"
					formControlName="active"
					color="primary"><span class="labels">{{
					'CARRIERS_VIEW.PROMOTIONS.IS_ACTIVE' | translate
				}}</span></ion-checkbox>
			</ion-item>
		</ion-col>
	</ion-row>
	<ion-row>
		<ion-col text-center>
			<e-cu-file-uploader (uploadedImgUrl)="image.setValue($event)">
			</e-cu-file-uploader>
		</ion-col>
	</ion-row>
	<ion-row *ngIf="image">
		<ion-col text-center>
			<ion-thumbnail>
				<ion-img
					*ngIf="image && image.value"
					[src]="image.value"
					#imagePreview
					[alt]="'Invalid image'"
				></ion-img>
			</ion-thumbnail>
		</ion-col>
	</ion-row>
</form>
