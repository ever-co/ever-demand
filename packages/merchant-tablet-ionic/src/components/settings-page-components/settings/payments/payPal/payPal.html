<!-- TODO add translate -->
<form class="payments-mutation-popup-form paypal-gateway" [formGroup]="form">
	<ion-grid>
		<ion-row class="paypal-selects">
			<ion-col>
				<ion-item>
					<ion-select labelPlacement="floating"
						formControlName="mode"
						[cancelText]="'Cancel'"
						[okText]="'OK'"
						[placeholder]="'Choose PayPal mode'"><div slot="label" class="labels">Mode</div>
						<ion-select-option
							*ngFor="let type of payPalTypes"
							value="{{ type }}"
							>{{ type }}
						</ion-select-option>
					</ion-select>
				</ion-item>
			</ion-col>
			<ion-col>
				<ion-item>
					<ion-select labelPlacement="floating"
						formControlName="currency"
						[cancelText]="'Cancel'"
						[okText]="'OK'"><div slot="label" class="labels">Currency</div>
						<ion-select-option
							*ngFor="let code of currenciesCodes"
							value="{{ code }}"
							>{{ code }}
						</ion-select-option>
					</ion-select>
				</ion-item>
			</ion-col>
		</ion-row>
		<ion-row>
			<ion-col>
				<ion-item>
					<ion-input labelPlacement="floating"
						type="text"
						formControlName="publishableKey"><div slot="label" class="labels">Publishable key</div></ion-input>
				</ion-item>
				<div
					*ngIf="
						publishableKey.invalid &&
						(publishableKey.dirty || publishableKey.touched)
					"
					class="validation-errors"
				>
					<span *ngIf="publishableKey.errors.required"
						>Publishable key is required</span
					>
				</div>
			</ion-col>
		</ion-row>
		<ion-row>
			<ion-col>
				<ion-item>
					<ion-input labelPlacement="floating"
						type="text"
						formControlName="secretKey"><div slot="label" class="labels">Secret key</div></ion-input>
				</ion-item>
				<div
					*ngIf="
						secretKey.invalid &&
						(secretKey.dirty || secretKey.touched)
					"
					class="validation-errors"
				>
					<span *ngIf="secretKey.errors.required"
						>Secret key is required</span
					>
				</div>
			</ion-col>
		</ion-row>
		<ion-row>
			<ion-col>
				<ion-item>
					<ion-input labelPlacement="floating"
						type="text"
						formControlName="description"><div slot="label" class="labels">Payment description</div></ion-input>
				</ion-item>
				<div
					*ngIf="
						description.invalid &&
						(description.dirty || description.touched)
					"
					class="validation-errors"
				>
					<span *ngIf="description.errors.required"
						>Payment description is required</span
					>
				</div>
			</ion-col>
		</ion-row>
	</ion-grid>
</form>
