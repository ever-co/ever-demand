<!-- Ionic 8 removed the legacy ion-label + ion-radio form: the label is the radio content now -->

<ion-header>
	<ion-toolbar color="primary">
		<ion-buttons slot="start">
			<ion-menu-button autoHide="false"></ion-menu-button>
		</ion-buttons>

		<ion-title [ngClass]="platform.isRTL ? 'rtl' : 'ltr'">{{ 'LANGUAGE_VIEW.TITLE' | translate }}</ion-title>
		<ion-buttons slot="end">
			<ion-button (click)="goBack()">
				<i class="fa fa-angle-left back-btn"></i>
				<span>{{ 'BACK' | translate }}</span>
			</ion-button>
		</ion-buttons>
	</ion-toolbar>
</ion-header>

<ion-content scroll="false">
	<ion-list>
		<ion-radio-group [(ngModel)]="language">
			<ion-item>
				<ion-radio value="en-US" justify="space-between">{{
					'ENGLISH' | translate
				}}</ion-radio>
			</ion-item>
			<ion-item>
				<ion-radio value="bg-BG" justify="space-between">{{
					'BULGARIAN' | translate
				}}</ion-radio>
			</ion-item>
			<ion-item>
				<ion-radio value="he-IL" justify="space-between">{{
					'HEBREW' | translate
				}}</ion-radio>
			</ion-item>
			<ion-item>
				<ion-radio value="ru-RU" justify="space-between">{{
					'RUSSIAN' | translate
				}}</ion-radio>
			</ion-item>
			<ion-item>
				<ion-radio value="es-ES" justify="space-between">{{
					'SPANISH' | translate
				}}</ion-radio>
			</ion-item>
			<ion-item>
				<ion-radio value="fr-FR" justify="space-between">{{
					'FRENCH' | translate
				}}</ion-radio>
			</ion-item>
		</ion-radio-group>
	</ion-list>
</ion-content>
