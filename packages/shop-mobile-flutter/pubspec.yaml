name: shop_flutter_mobile
description: Ever Demand customer shop app (Flutter). Feature parity with packages/shop-mobile-ionic.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Material and Cupertino moved out of the SDK (package:flutter/material.dart
  # is deprecated since Flutter 3.47).
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7

  # State, navigation
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4

  # Backend: GraphQL (HTTP + graphql-ws) and the socket.io "pyro" RPC
  graphql: ^5.2.4
  socket_io_client: ^3.1.6
  http: ^1.6.0
  uuid: ^4.6.0

  # Platform
  shared_preferences: ^2.5.6
  geolocator: ^14.1.2
  # 7.3.2 needs dbus ^0.8 (nm 0.6); geolocator_linux 0.2.6 still pins dbus ^0.7.3.
  connectivity_plus: ^7.3.1
  url_launcher: ^6.3.3
  mobile_scanner: ^7.5.0

  # Payments (card entry for a new card; saved cards go through the API only)
  flutter_stripe: ^15.0.0
  flutter_stripe_web: ^9.0.0

  # UI
  intl: ^0.20.2
  cupertino_icons: ^2.0.0
  font_awesome_flutter: ^11.0.0
  flutter_svg: ^2.5.0
  flutter_widget_from_html_core: ^0.17.4
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  barcode_widget: ^2.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/imgs/

  fonts:
    - family: PlutoHeavyItalic
      fonts:
        - asset: assets/fonts/PlutoHeavyItalic.ttf
          style: italic
          weight: 700
