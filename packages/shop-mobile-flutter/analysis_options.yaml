# flutter analyze / dart analyze settings. Base set: package:flutter_lints
# (recommended Flutter lints), plus a few stricter rules for this app.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - lib/l10n/gen/**
    - build/**
    - android/**
    - ios/**
    - web/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - use_build_context_synchronously
