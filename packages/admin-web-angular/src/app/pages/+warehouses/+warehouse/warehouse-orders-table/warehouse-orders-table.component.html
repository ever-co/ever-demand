<div>Orders table view</div>

<nb-card>
	<nb-card-header class="header-color">
		<div class="row">
			<div class="col-md-12">
				<button
					nbButton
					status="success"
					(click)="openWarehouseOrderCreateModal()"
				>
					<i class="ion-md-add button-icon me-1"></i>
					{{ 'WAREHOUSE_VIEW.CREATE_ORDER' | translate }}
				</button>
			</div>
		</div>
	</nb-card-header>

	<nb-card-body style="overflow: hidden;">
		<div class="row">
			<div class="col-md-4">
				<div
					role="group"
					class="btn-group btn-group-toggle btn-outline-toggle-group btn-group-full-width btn-toggle-radio-group"
				>
					<label
						class="btn btn-outline-secondary btn-tn"
						[class.active]="$any(filterMode) === 'ready'"
					>
						<input
							type="radio"
							class="btn-check"
							value="ready"
							[checked]="$any(filterMode) === 'ready'"
							(click)="filterOrders('ready')"
						/>
						{{ 'Confirmed' | translate }}
					</label>

					<label
						class="btn btn-outline-secondary btn-tn"
						[class.active]="$any(filterMode) === 'in_delivery'"
					>
						<input
							type="radio"
							class="btn-check"
							value="in_delivery"
							[checked]="$any(filterMode) === 'in_delivery'"
							(click)="filterOrders('in_delivery')"
						/>
						{{ 'In Delivery' | translate }}
					</label>

					<label
						class="btn btn-outline-secondary btn-tn"
						[class.active]="$any(filterMode) === 'not_confirmed'"
					>
						<input
							type="radio"
							class="btn-check"
							value="not_confirmed"
							[checked]="$any(filterMode) === 'not_confirmed'"
							(click)="filterOrders('not_confirmed')"
						/>
						{{ 'Not Confirmed' | translate }}
					</label>

					<label
						class="btn btn-outline-secondary btn-tn"
						[class.active]="$any(filterMode) === 'cancelled'"
					>
						<input
							type="radio"
							class="btn-check"
							value="cancelled"
							[checked]="$any(filterMode) === 'cancelled'"
							(click)="filterOrders('cancelled')"
						/>
						{{ 'Cancelled' | translate }}
					</label>

					<label
						class="btn-outline-secondary btn-tn"
						[class.active]="$any(filterMode) === 'all'"
					>
						<input
							type="radio"
							class="btn-check"
							value="all"
							[checked]="$any(filterMode) === 'all'"
							(click)="filterOrders('all')"
						/>
						{{ 'All' | translate }}
					</label>
				</div>
			</div>
		</div>
	</nb-card-body>

	<nb-card-footer>
		<ng2-smart-table
			[settings]="settingsSmartTable"
			[source]="sourceSmartTable"
			(userRowSelect)="selectOrder($event)"
		>
		</ng2-smart-table>
	</nb-card-footer>
</nb-card>
