<mat-toolbar class="toolbar" color="primary">
	<a class="logo" routerLink="/">
		<img src="assets/img/ever-logo.svg" [alt]="'HOME' | translate" />
	</a>

	<div class="menu-brand-separator"></div>

	<span class="nav">
		<button
			mat-button
			class="nav-option"
			[routerLink]="['/products']"
			[routerLinkActive]="'active-option'"
		>
			<ever-icon type="basket" class="nav-icon"></ever-icon>
			{{ 'Products' | translate }}
		</button>
		<button
			mat-button
			class="nav-option"
			[routerLink]="['/orders']"
			[routerLinkActive]="'active-option'"
		>
			<ever-icon type="history" class="nav-icon"></ever-icon>
			{{ 'Orders' | translate }}
		</button>
	</span>

	<section class="right-elements">
		<span class="toggle-order-type">
			<small
				(click)="toggleGetProductsType()"
				[ngClass]="{ 'no-select': isDeliveryRequired }"
				class="ms-3"
				>{{ 'TAKEAWAY' | translate }}</small
			>
			<mat-slide-toggle
				class="example-margin me-2 ms-2"
				(change)="toggleGetProductsType()"
				[checked]="isDeliveryRequired"
			>
			</mat-slide-toggle>
			<small
				(click)="toggleGetProductsType()"
				[ngClass]="{ 'no-select': !isDeliveryRequired }"
				class="me-3"
				>{{ 'DELIVERY' | translate }}</small
			>
		</span>
		<mat-search
			#matSearch
			[color]="'#353748'"
			focusedColor="#f1f1f1"
			(searchLocation)="tryFindNewAddress($event)"
			(detectLocation)="loadAddress(true)"
		></mat-search>
	</section>

	<div class="nav">
		<button
			mat-button
			class="nav-option"
			[routerLink]="['/settings']"
			[attr.aria-label]="'SETTINGS_VIEW.SETTINGS' | translate"
		>
			<ever-icon
				type="settings"
				class="nav-icon"
				aria-hidden="true"
			></ever-icon>
		</button>
	</div>
</mat-toolbar>
