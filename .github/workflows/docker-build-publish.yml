name: Build and Publish Docker Images

on:
    push:
        branches:
          - develop
          - stage
          - master

# One run per branch at a time. Runs are not cancelled, so an older run can never
# cancel a newer one; a run whose commit is no longer the branch head pushes only
# its :sha- tag (step "head"), never the moving :latest / :dev / :stage / :prod.
concurrency:
    group: docker-build-publish-${{ github.ref }}
    cancel-in-progress: false

jobs:
    ever-api:
        runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: Login to DockerHub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Login to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GH_TOKEN }}
            - name: Install doctl
              if: ${{ vars.DO_ENABLED == 'true' }}
              uses: digitalocean/action-doctl@v2
              with:
                  token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

            - name: Log in to DigitalOcean Container Registry with short-lived credentials
              if: ${{ vars.DO_ENABLED == 'true' }}
              run: doctl registry login --expiry-seconds 3600

            # The tag of this branch, for Argo CD Image Updater (one tag per environment):
            # develop -> :dev, stage -> :stage, master -> :prod. :latest stays as before.
            - name: Image tag of the branch
              id: t
              run: |
                  case "${GITHUB_REF_NAME}" in
                    develop) echo "tag=dev" >> "$GITHUB_OUTPUT" ;;
                    stage) echo "tag=stage" >> "$GITHUB_OUTPUT" ;;
                    main|master) echo "tag=prod" >> "$GITHUB_OUTPUT" ;;
                    *) echo "tag=${GITHUB_REF_NAME////-}" >> "$GITHUB_OUTPUT" ;;
                  esac

            # A run that finishes after a newer one on the same branch must not put its
            # older image under the moving tags (:latest, :dev / :stage / :prod).
            - name: Is this commit still the head of the branch?
              id: head
              run: |
                  head=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
                  if [ -n "$head" ] && [ "$head" != "${GITHUB_SHA}" ]; then
                      echo "stale=true" >> "$GITHUB_OUTPUT"
                      echo "::notice::${GITHUB_SHA} is no longer the head of ${GITHUB_REF_NAME} ($head): only its :sha- tag is pushed"
                  else
                      echo "stale=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Build
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./.deploy/api/Dockerfile
                  load: true
                  build-args: |
                      VERDACCIO_REGISTRY=${{ vars.VERDACCIO_REGISTRY }}
                  tags: |
                      ghcr.io/ever-co/ever-api:latest
                      ghcr.io/ever-co/ever-api:${{ steps.t.outputs.tag }}
                      ghcr.io/ever-co/ever-api:sha-${{ github.sha }}
                      everco/ever-api:latest
                      registry.digitalocean.com/ever/ever-api:latest

            - name: Push to DigitalOcean Registry
              if: ${{ vars.DO_ENABLED == 'true' }}
              run: |
                  docker push registry.digitalocean.com/ever/ever-api:latest

            - name: Push to Github Registry
              run: |
                  # only the tags built in this run (never stale local tags)
                  docker push ghcr.io/ever-co/ever-api:sha-${{ github.sha }}
                  if [ "${{ steps.head.outputs.stale }}" != "true" ]; then
                      docker push ghcr.io/ever-co/ever-api:latest
                      docker push ghcr.io/ever-co/ever-api:${{ steps.t.outputs.tag }}
                  fi

            - name: Push to Docker Hub Registry
              run: |
                  if [ "${{ steps.head.outputs.stale }}" != "true" ]; then
                      docker push everco/ever-api:latest
                  fi

