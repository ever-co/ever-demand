name: CI

# Typecheck, unit tests, builds and e2e for every package on the latest stack.
# Runs on pull requests and on demand; image publishing stays in docker-build-publish.yml.
on:
    pull_request:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

env:
    NODE_VERSION: '26.13.1'
    PNPM_VERSION: '12.23.0'
    NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
    node:
        name: Node packages (typecheck, unit tests, builds)
        runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
              with:
                  version: ${{ env.PNPM_VERSION }}
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build:common
            - run: pnpm run typecheck
            - run: pnpm run test
            - run: pnpm run build

    e2e:
        name: e2e (API + web apps, Playwright)
        runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
        timeout-minutes: 90
        services:
            mongo:
                image: mongo:8
                ports:
                    - 27017:27017
        env:
            DB_URI: mongodb://localhost:27017/ever_e2e
            DB_NAME: ever_e2e
            CORE_E2E_MONGO_URL: mongodb://localhost:27017
            FAKE_DATA_GENERATOR: 'true'
            FAKE_INVITE_CODE: '8321'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
              with:
                  version: ${{ env.PNPM_VERSION }}
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter @ever-platform/e2e exec playwright install --with-deps chromium
            - run: pnpm run build:server
            - name: API e2e (Jest, real MongoDB)
              run: pnpm --filter @ever-platform/core run test:e2e
            - name: Start the API
              run: |
                  pnpm --filter @ever-platform/core start > api.log 2>&1 &
                  for i in $(seq 1 48); do curl -sf -m 5 http://localhost:8443/api/health > /dev/null && break; sleep 5; done; curl -sf -m 5 http://localhost:8443/api/health
            - run: pnpm --filter @ever-platform/e2e exec playwright test --project=api
            - name: Build and serve the web apps
              run: |
                  pnpm run build:admin && pnpm run build:shopweb && pnpm run build:shopmobile && pnpm run build:carrier && pnpm run build:merchant
                  node e2e/serve-apps.mjs > apps.log 2>&1 &
                  for p in 4200 3000 4201 4202 4203; do for i in $(seq 1 24); do curl -sf -m 5 http://localhost:$p/ > /dev/null && break; sleep 5; done; curl -sf -m 5 -o /dev/null http://localhost:$p/; done
            - run: pnpm --filter @ever-platform/e2e exec playwright test --project=admin --project=shop-web --project=shop-mobile --project=merchant --project=carrier
            - if: failure()
              run: tail -n 200 api.log apps.log || true
            - if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: playwright-report
                  path: e2e/playwright-report
                  retention-days: 7

    expo:
        name: Expo app (tests, web + Android bundles)
        runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
              with:
                  version: ${{ env.PNPM_VERSION }}
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter @ever-platform/shop-mobile-expo run typecheck
            - run: pnpm --filter @ever-platform/shop-mobile-expo run test
            - run: pnpm --filter @ever-platform/shop-mobile-expo run export:web
            - run: pnpm --filter @ever-platform/shop-mobile-expo run export:android

    flutter:
        name: Flutter app (analyze, tests, web + APK builds)
        runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
        timeout-minutes: 45
        defaults:
            run:
                working-directory: packages/shop-mobile-flutter
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
              with:
                  channel: stable
                  flutter-version: 3.50.1
                  cache: true
            - run: flutter pub get --enforce-lockfile
            - run: flutter analyze
            - run: flutter test test
            - run: flutter build web --release
            - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
              with:
                  distribution: temurin
                  java-version: '21'
            - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
            - run: flutter build apk --debug
