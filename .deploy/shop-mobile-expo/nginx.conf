# Single-page app: every unknown path serves index.html (React Navigation reads the URL).
server {
	listen 8081;
	server_name _;
	root /usr/share/nginx/html;

	location / {
		try_files $uri $uri/ /index.html;
	}

	location ~* \.(js|css|png|jpg|svg|ttf|woff2?)$ {
		expires 30d;
		add_header Cache-Control "public, immutable";
	}
}
