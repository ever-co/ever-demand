---
kind: Service
apiVersion: v1
metadata:
    name: ever-demo-admin-lb
spec:
    type: ClusterIP
    selector:
        app: ever-demo-admin
    ports:
        - name: http
          protocol: TCP
          port: 80
          targetPort: 4200

---
kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
    name: ever-demo-admin-lb-ingress
    namespace: default
    annotations:
        nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
spec:
    ingressClassName: nginx
    rules:
        - host: admindemo.ever.co
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: ever-demo-admin-lb
                            port:
                                number: 80
    tls:
        - hosts:
              - admindemo.ever.co
          secretName: admindemo.ever.co-tls

